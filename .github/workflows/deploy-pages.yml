name: Deploy PROCESS//FORGE to GitHub Pages

# Publishes the self-contained app in event-log-generator/ui as a static site.
on:
  push:
    branches:
      - claude/web-page-artifact-06e4ri
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: event-log-generator/ui

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
