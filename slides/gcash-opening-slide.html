<title>GCash — Opening Slide</title>
<style>
  :root {
    --ink: #050914;
    --sky-top: #04081a;
    --sky-mid: #241c55;
    --sky-warm: #a83e5c;
    --sky-horizon: #ff7a45;
    --sky-gold: #ffc15e;
    --brand-blue: #2f6bff;
    --brand-blue-deep: #123b7a;
    --text-hero: #fbf3e4;
    --text-sub: #cdd6f7;
    --text-tag: #ffcf8a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #01030a;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  .slide {
    position: relative;
    width: 100%;
    max-width: 1920px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ink);
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
  }

  .slide svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(100deg, rgba(3,5,15,0.94) 0%, rgba(3,5,15,0.72) 32%, rgba(3,5,15,0.18) 58%, rgba(3,5,15,0) 72%),
      linear-gradient(to top, rgba(2,4,12,0.75) 0%, rgba(2,4,12,0) 42%);
    pointer-events: none;
  }

  .content {
    position: absolute;
    left: 5.4%;
    bottom: 9%;
    max-width: 54%;
    color: var(--text-hero);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 0.7em;
    font-size: clamp(11px, 1.05vw, 17px);
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--text-tag);
    margin: 0 0 1.1em;
  }

  .eyebrow::before {
    content: "";
    width: 2.6em;
    height: 2px;
    background: var(--text-tag);
    opacity: 0.85;
  }

  h1 {
    margin: 0;
    font-size: clamp(52px, 8.4vw, 152px);
    line-height: 0.94;
    font-weight: 800;
    letter-spacing: -0.015em;
    color: var(--text-hero);
    text-wrap: balance;
  }

  h1 span {
    display: block;
    background: linear-gradient(95deg, #ffffff 0%, #ffffff 55%, #bcd0ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 0.65em 0 0;
    font-size: clamp(15px, 1.7vw, 30px);
    font-weight: 400;
    color: var(--text-sub);
    letter-spacing: 0.002em;
  }

  .locale {
    position: absolute;
    right: 5%;
    bottom: 7.5%;
    display: flex;
    align-items: center;
    gap: 0.6em;
    padding: 0.6em 1.1em;
    border: 1px solid rgba(255, 246, 224, 0.35);
    border-radius: 999px;
    color: var(--text-hero);
    font-size: clamp(10px, 0.85vw, 14px);
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: rgba(5, 8, 20, 0.35);
    backdrop-filter: blur(6px);
  }

  .locale svg { width: 1.1em; height: 1.1em; flex: none; }

  @media (prefers-reduced-motion: no-preference) {
    .drift { animation: drift 7s ease-in-out infinite; }
    .drift-slow { animation: drift 11s ease-in-out infinite; }
    @keyframes drift {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
  }
</style>
